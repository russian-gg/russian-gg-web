name: Deploy Stage Frontend

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Stage Admin
        run: npm run build:admin

      - name: Package release
        run: git archive --format=tar.gz --output=frontend-stage-release.tgz HEAD

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Ensure stage directories exist
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /opt/russian-gg/releases/staging /opt/russian-gg/stage/russian-gg-web"

      - name: Upload stage release bundle
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" scp -O -o StrictHostKeyChecking=no -P "$PORT" \
            frontend-stage-release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/opt/russian-gg/releases/staging/frontend-stage-release.tgz"

      - name: Deploy stage frontend on server
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            mkdir -p /opt/russian-gg/stage/russian-gg-web
            find /opt/russian-gg/stage/russian-gg-web -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf /opt/russian-gg/releases/staging/frontend-stage-release.tgz -C /opt/russian-gg/stage/russian-gg-web

            if [ -f /opt/russian-gg/stage/russian-gg-server/deploy/docker-compose.prod.yml ]; then
              install -m 0644 /opt/russian-gg/stage/russian-gg-server/deploy/Caddyfile /opt/russian-gg/russian-gg-server/deploy/Caddyfile
              install -m 0644 /opt/russian-gg/stage/russian-gg-server/deploy/docker-compose.prod.yml /opt/russian-gg/russian-gg-server/deploy/docker-compose.prod.yml
              install -m 0755 /opt/russian-gg/stage/russian-gg-server/deploy/manage-stack.sh /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh
            fi

            chmod +x /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh
            if grep -q "stage-admin-web:" /opt/russian-gg/russian-gg-server/deploy/docker-compose.prod.yml; then
              bash /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh up -d --build stage-web stage-admin-web caddy
            else
              bash /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh up -d --build stage-web caddy
            fi
          '

      - name: Wait for stage admin HTTPS
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsSI https://stageadmin.russian.gg/ >/dev/null; then
              echo "stageadmin.russian.gg is up"
              exit 0
            fi

            echo "Waiting for stageadmin.russian.gg HTTPS ($attempt/20)..."
            sleep 15
          done

          echo "stageadmin.russian.gg did not become healthy in time" >&2
          exit 1

      - name: Dump Caddy logs on failure
        if: failure()
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            cd /opt/russian-gg/russian-gg-server/deploy
            docker compose -f docker-compose.prod.yml logs --tail=200 caddy
          '
