name: Deploy Frontend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Admin
        run: npm run build:admin

      - name: Package release
        run: |
          git archive --format=tar.gz --output=frontend-release.tgz HEAD

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Ensure release directory exists
        run: |
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            '
            set -euo pipefail
            mkdir -p /opt/russian-gg/releases
            '

      - name: Upload release bundle
        run: |
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" scp -O -o StrictHostKeyChecking=no -P "$PORT" \
            frontend-release.tgz "$DEPLOY_USER@$DEPLOY_HOST:/opt/russian-gg/releases/frontend-release.tgz"

      - name: Deploy on server
        run: |
          PORT="${DEPLOY_PORT:-22}"
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            '
            set -euo pipefail
            mkdir -p /opt/russian-gg/russian-gg-web
            find /opt/russian-gg/russian-gg-web -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf /opt/russian-gg/releases/frontend-release.tgz -C /opt/russian-gg/russian-gg-web
            chmod +x /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh
            if grep -q "admin-web:" /opt/russian-gg/russian-gg-server/deploy/docker-compose.prod.yml; then
              bash /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh up -d --build web admin-web caddy
            else
              bash /opt/russian-gg/russian-gg-server/deploy/manage-stack.sh up -d --build web caddy
            fi
            '
