name: Russian.gg Frontend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy images to the new production server
        required: true
        default: false
        type: boolean

concurrency:
  group: russian-gg-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE_REPOSITORY: ghcr.io/russian-gg/russian-gg-web
  ADMIN_WEB_IMAGE_REPOSITORY: ghcr.io/russian-gg/russian-gg-admin-web
  APP_DIR: /srv/apps/russian-gg
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '7256' }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '718388409500-ljra0b5j8j3dpubieljmd228gd1c55p3.apps.googleusercontent.com' }}

jobs:
  build_and_push:
    name: Build and push frontend images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.WEB_IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.WEB_IMAGE_REPOSITORY }}:latest
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=russian-gg-web
          cache-to: type=gha,mode=max,scope=russian-gg-web

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.admin
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ADMIN_WEB_IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.ADMIN_WEB_IMAGE_REPOSITORY }}:latest
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=russian-gg-admin-web
          cache-to: type=gha,mode=max,scope=russian-gg-admin-web

  deploy:
    name: Deploy frontend manually
    needs:
      - build_and_push

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_IMAGE_REPOSITORY: ${{ env.WEB_IMAGE_REPOSITORY }}
          ADMIN_WEB_IMAGE_REPOSITORY: ${{ env.ADMIN_WEB_IMAGE_REPOSITORY }}
          RELEASE_TAG: ${{ github.sha }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN,WEB_IMAGE_REPOSITORY,ADMIN_WEB_IMAGE_REPOSITORY,RELEASE_TAG,APP_DIR

          script: |
            set -Eeuo pipefail

            cd "$APP_DIR"

            test -f docker-compose.yml
            test -f .env
            docker network inspect edge >/dev/null

            get_env_value() {
              key="$1"
              sed -n "s/^${key}=//p" .env | tail -n 1
            }

            set_env_value() {
              key="$1"
              value="$2"
              updated_content="$(
                awk -v key="$key" -v value="$value" '
                  BEGIN { found = 0 }
                  index($0, key "=") == 1 {
                    if (!found) {
                      print key "=" value
                      found = 1
                    }
                    next
                  }
                  { print }
                  END {
                    if (!found) {
                      print key "=" value
                    }
                  }
                ' .env
              )"

              # Write through the existing file descriptor. Unlike sed -i,
              # this does not require write permission on APP_DIR itself.
              printf '%s\n' "$updated_content" >.env
            }

            PREVIOUS_WEB_TAG="$(get_env_value WEB_IMAGE_TAG)"
            PREVIOUS_ADMIN_TAG="$(get_env_value ADMIN_WEB_IMAGE_TAG)"

            # Shell variables override .env for this release. Persist the new
            # tags only after both routes pass their checks.
            export WEB_IMAGE_REPOSITORY
            export WEB_IMAGE_TAG="$RELEASE_TAG"
            export ADMIN_WEB_IMAGE_REPOSITORY
            export ADMIN_WEB_IMAGE_TAG="$RELEASE_TAG"

            WEB_HOST="$(get_env_value WEB_HOST)"
            ADMIN_HOST="$(get_env_value ADMIN_HOST)"

            test -n "$WEB_HOST"
            test -n "$ADMIN_HOST"

            compose() {
              docker compose --env-file .env "$@"
            }

            DOCKER_CONFIG_DIR="$(mktemp -d /tmp/russian-gg-frontend-docker.XXXXXX)"
            chmod 700 "$DOCKER_CONFIG_DIR"
            export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"

            cleanup() {
              rm -f "$DOCKER_CONFIG_DIR/config.json"
              rmdir "$DOCKER_CONFIG_DIR" 2>/dev/null || true
            }

            trap cleanup EXIT

            echo "$GHCR_TOKEN" |
              docker login \
                --username "$GHCR_USER" \
                --password-stdin \
                ghcr.io

            compose config --quiet
            compose pull web admin-web
            compose up -d --no-deps web admin-web

            check_route() {
              host="$1"

              for attempt in $(seq 1 30); do
                if curl \
                  --insecure \
                  --resolve "${host}:443:127.0.0.1" \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 10 \
                  "https://${host}/" \
                  >/dev/null; then
                  return 0
                fi

                echo "Route check ${attempt}/30 failed for ${host}; retrying..."
                sleep 3
              done

              return 1
            }

            if ! check_route "$WEB_HOST" || ! check_route "$ADMIN_HOST"; then
              echo "Frontend route check failed."
              compose logs --tail=150 web admin-web || true

              if [ -n "$PREVIOUS_WEB_TAG" ] && [ -n "$PREVIOUS_ADMIN_TAG" ]; then
                echo "Rolling back frontend images."
                export WEB_IMAGE_TAG="$PREVIOUS_WEB_TAG"
                export ADMIN_WEB_IMAGE_TAG="$PREVIOUS_ADMIN_TAG"
                compose pull web admin-web
                compose up -d --no-deps web admin-web
              else
                echo "Previous frontend tags were not found; automatic rollback is unavailable."
              fi

              exit 1
            fi

            set_env_value WEB_IMAGE_REPOSITORY "$WEB_IMAGE_REPOSITORY"
            set_env_value WEB_IMAGE_TAG "$RELEASE_TAG"
            set_env_value ADMIN_WEB_IMAGE_REPOSITORY "$ADMIN_WEB_IMAGE_REPOSITORY"
            set_env_value ADMIN_WEB_IMAGE_TAG "$RELEASE_TAG"

            docker image prune --force --filter "until=168h" >/dev/null
            compose ps web admin-web

            echo "Russian.gg frontend deployed successfully."
