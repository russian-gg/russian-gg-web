server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, and the upstream held in a variable rather than written into
    # proxy_pass directly.
    #
    # With a literal hostname nginx resolves it once, at startup, and keeps that address for
    # the life of the process. Every deploy gives the API container a new IP, so nginx went on
    # proxying to an address nothing was listening on and answered 502 — with the API up and
    # healthy the whole time, which is exactly how it looked in production. Re-resolved every
    # ten seconds instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream stage-api;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The worker decides what every other request does, so a stale copy of it is the one
    # cache mistake that cannot be corrected from the client. Always revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Chrome ignores a manifest that does not arrive as this type, and an ignored manifest
    # means the install offer never appears — with nothing anywhere saying why.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://$upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /openapi/ {
        proxy_pass http://$upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /scalar/ {
        proxy_pass http://$upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /media/ {
        proxy_pass http://$upstream:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "private, no-store";
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
